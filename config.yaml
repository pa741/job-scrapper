# Search parameters passed to jobspy.scrape_jobs().
# See https://github.com/speedyapply/JobSpy for the full list of supported
# site_name values and search options.
search:
  # glassdoor omitted: its CSRF-token endpoint currently 404s after Glassdoor's
  # Next.js migration, so every request gets rejected regardless of location/
  # search term. Unmerged upstream fix: https://github.com/speedyapply/JobSpy/pull/347
  site_name:
    - indeed
    - linkedin
    - google
    # Not a scraped board: freehire.me is an aggregator with a public API,
    # covering IT/tech roles crawled from 227 ATS/boards. It ignores PROXIES
    # by design - there is nothing there to route around.
    - freehire

  google_search_term: "software engineer"

  search_term: "software engineer"
  enforce_annual_salary: true
  location: "London, UK"
  linkedin_fetch_description: true
  results_wanted: 1000
  hours_old: 24
  country_indeed: "UK"

  # Pull each freehire posting's full description rather than the search index's
  # truncated preview. Costs a bigger response, not extra requests.
  freehire_full_description: true

  # Any additional freehire facet, applied over the filters derived from the
  # options above. Its live vocabulary is at
  # https://freehire.me/api/v1/jobs/facets - an unknown value matches nothing
  # rather than erroring, so check there before adding one.
  # freehire_filters:
  #   seniority: senior
  #   skills: python,go
  #   work_mode: remote
