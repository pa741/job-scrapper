# The defaults every search shares, and a fallback list of searches.
#
# WHICH SEARCHES RUN NORMALLY COMES FROM THE PLATFORM, not from this file. Each
# user configures their own from the dashboard's Searches page, and the platform
# publishes the whole enabled set to scraper-config/searches.json, which this
# scraper reads at the start of every run. The `searches:` list below is used
# only when nothing has been published - see the README.
#
# What stays here is what is true of *this machine* rather than of a search:
# verbosity, whether LinkedIn descriptions are fetched, whether salaries are
# annualised. A published search's options are merged over these, and the
# platform omits an option nobody chose rather than sending null, so nothing
# here is blanked by a form somebody left empty.
#
# See https://github.com/pa741/JobSpy for the supported site_name values and
# search options - that is our fork, and it has options upstream does not.
#
# Each search is scraped and uploaded separately, as jobs/<name>_<timestamp>.csv.
# The name is how the platform tells the searches apart, so it is the axis the
# dashboard groups by - not just a filename. For a published search that name is
# the slug the platform assigned it.

# Shared by every search, published or local. Anything a search names for itself wins.
defaults:
  # glassdoor omitted: its CSRF-token endpoint currently 404s after Glassdoor's
  # Next.js migration, so every request gets rejected regardless of location/
  # search term. Unmerged upstream fix: https://github.com/speedyapply/JobSpy/pull/347
  # google omitted: its scraper reads a cursor out of the search page's markup and
  # that markup has moved, so it returns nothing even from a clean IP ("initial
  # cursor not found"). Through residential proxies it is worse - Google answers
  # with /sorry/index and 429s until urllib3 gives up. Verified broken on stock
  # python-jobspy 1.1.82 too, so this is not the fork. Re-enable if we fix it there.
  site_name:
    - indeed
    - linkedin
    # Not a scraped board: freehire.me is an aggregator with a public API,
    # covering IT/tech roles crawled from 227 ATS/boards. It ignores PROXIES
    # by design - there is nothing there to route around.
    - freehire

  location: "London, UK"
  country_indeed: "UK"
  hours_old: 24
  enforce_annual_salary: true
  linkedin_fetch_description: true

  # Searches run one after another, so this is per search and a run costs the sum.
  # With linkedin_fetch_description on, LinkedIn spends roughly one extra request
  # per posting, so raising this multiplies across every search.
  results_wanted: 500

  # jobspy's own per-site logging: 0 errors only, 1 +warnings, 2 all. Its default
  # is 0, which makes a site quietly returning nothing look identical to one that
  # returned results. At 2 a scheduled run records the per-site counts, and
  # surfaces freehire's warning when it drops a filter it did not recognise.
  verbose: 2

  # Pull each freehire posting's full description rather than the search index's
  # truncated preview. Costs a bigger response, not extra requests.
  freehire_full_description: true

# Fallback only: run when the platform has published nothing. Once somebody adds
# a search from the dashboard, this list stops being read.
searches:
  # `name` is optional and defaults to the slugified search_term. Set it
  # explicitly when two searches would otherwise collide - the same search_term
  # in two locations, say - because a duplicate name is refused at startup rather
  # than silently merging the two into one search term downstream.
  - search_term: "software engineer"

  # Add more below. Any option from `defaults` can be overridden per search.
  #
  # - search_term: "data engineer"
  #
  # - name: python-remote
  #   search_term: "python developer"
  #   is_remote: true
  #   results_wanted: 300
  #
  # - name: software-engineer-berlin
  #   search_term: "software engineer"
  #   location: "Berlin, Germany"
  #   country_indeed: "Germany"
  #
  # freehire_filters passes any additional freehire facet through, applied over
  # the filters derived from the options above. Its live vocabulary is at
  # https://freehire.me/api/v1/jobs/facets - an unknown value matches nothing
  # rather than erroring, so check there before adding one.
  #
  # - name: senior-go
  #   search_term: "golang"
  #   freehire_filters:
  #     seniority: senior
  #     skills: go
