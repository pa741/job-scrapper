services:
  job-scrapper:
    # Replace <owner>/<repo> with this repo's GHCR image (see README "Container image").
    image: ghcr.io/<owner>/<repo>:latest
    environment:
      AZURE_STORAGE_CONNECTION_STRING: <your-azure-storage-connection-string>
      AZURE_CONTAINER_NAME: jobs-landing
      AZURE_CONFIG_CONTAINER_NAME: scraper-config
      HIREME_API_KEY: <optional-freehire-personal-api-key>
      PROXIES: <proxy1-e.g.-user:pass@host:port>,<proxy2>
    volumes:
      # Still mounted: it holds the operational defaults every search shares, and is
      # the fallback for when the platform has published nothing yet.
      - ./config.yaml:/app/config.yaml:ro
